<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Owner activity</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<style>
/* Layout: an analytics console. Sticky filter bar, section rail on the left (tabs on a phone), chart panels in a 12-column grid. Dark, in the app's green and gold. */
:root{
  --bg:#06140E; --panel:#0D1F17; --panel2:#112A1F; --line:#1E3A2D; --grid:#183226;
  --ink:#F2EBDD; --ink2:#B9C4BC; --muted:#7F948A; --gold:#C89B4A; --gold2:#E3BC74;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9085e9;
  --good:#0ca30c; --bad:#e66767;
  --sans:Inter,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:14px/1.45 var(--sans);margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(6,20,14,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.toprow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.brand .k{font-size:10px;letter-spacing:1.4px;font-weight:800;color:var(--gold)}
.brand .t{font-size:19px;font-weight:800}
.badge{font:600 10px var(--mono);letter-spacing:.8px;color:var(--bg);background:var(--gold);padding:3px 8px;border-radius:6px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:7px;color:var(--ink2);font-size:12px;font-weight:600}
.seg button.on{background:var(--gold);color:var(--bg)}
select,input[type=text],textarea{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:12px}
.shell{display:grid;grid-template-columns:190px minmax(0,1fr);gap:0}
.rail{position:sticky;top:120px;align-self:start;padding:14px 8px 14px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px}
.rail button{text-align:left;border:0;background:none;padding:8px 12px;border-radius:8px;color:var(--ink2);font-weight:600;font-size:13px;display:flex;justify-content:space-between}
.rail button.on{background:var(--panel2);color:var(--gold2)}
.rail button small{font:11px var(--mono);color:var(--muted)}
main{min-width:0;padding-block:16px 60px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:820px){.shell{grid-template-columns:1fr}.rail{position:static;flex-direction:row;overflow-x:auto;padding:10px 16px 0;padding-left:max(16px,env(safe-area-inset-left,0px))}
  .rail button{white-space:nowrap;border:1px solid var(--line)}.rail button small{display:none}main{padding-left:max(16px,env(safe-area-inset-left,0px))}}
h2{font-size:18px;margin:0 0 2px;text-wrap:balance}.lede{color:var(--muted);font-size:13px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.p{grid-column:span 12;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.c6{grid-column:span 6}.c4{grid-column:span 4}.c8{grid-column:span 8}.c3{grid-column:span 3}
@media (max-width:1100px){.c4,.c3{grid-column:span 6}.c8{grid-column:span 12}}
@media (max-width:700px){.c6,.c4,.c3,.c8{grid-column:span 12}}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.ph b{font-size:13px}.ph .sub{color:var(--muted);font-size:11px;display:block;font-weight:400;margin-top:1px}
.ask{border:1px solid var(--line);background:none;border-radius:7px;padding:3px 8px;font-size:11px;color:var(--gold2);white-space:nowrap}
.chart{width:100%;height:260px}.chart.tall{height:360px}.chart.short{height:200px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 12px 6px}
.kpi .l{font-size:11px;color:var(--muted);font-weight:600}
.kpi .v{font:600 24px var(--mono);margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .d{font:11px var(--mono)}.up{color:var(--good)}.down{color:var(--bad)}.flat{color:var(--muted)}
.kpi .sp{height:34px;margin-top:4px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--muted);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th.n,td.n{text-align:right}
td{padding:7px 8px;border-bottom:1px solid var(--grid);white-space:nowrap}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
.inbar{display:inline-block;height:6px;border-radius:3px;background:var(--gold);vertical-align:middle;margin-left:6px;opacity:.8}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--gold);background:var(--gold);color:var(--bg);border-radius:8px;padding:6px 12px;font-weight:700;font-size:12px}
.btn.ghost{background:none;color:var(--gold2)}
.field{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);font-weight:600}
.saved{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.sv{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel2);text-align:left}
.sv b{display:block;font-size:13px}.sv span{font-size:11px;color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:780px;border-radius:12px;padding:10px 12px;font-size:13px}
.msg.q{align-self:flex-end;background:var(--panel2);border:1px solid var(--line)}
.msg.a{background:var(--panel);border:1px solid var(--line)}
.msg.a p{margin:4px 0}.msg .meta{font:11px var(--mono);color:var(--muted);margin-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 10px;font-size:12px;color:var(--ink2)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;border:0;border-radius:999px;background:var(--gold);color:var(--bg);font-weight:800;padding:12px 18px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.screen{position:relative;width:230px;max-width:100%;aspect-ratio:9/19;margin:0 auto;border:3px solid var(--line);border-radius:22px;overflow:hidden;background:#071A12}
.ring{position:absolute;width:28px;height:28px;margin:-14px;border-radius:14px;border:3px solid #FF5A5A;background:rgba(255,90,90,.25)}
.ms{padding:12px 10px;font-size:9px}.ms .mt{font-size:15px;font-weight:800;margin:4px 0 8px}.ms .mb{background:#0E201A;border:1px solid #3A3524;border-radius:8px;height:34px;margin-bottom:6px}.ms .mb.big{height:70px}
.ms .tb{position:absolute;bottom:0;left:0;right:0;height:32px;border-top:1px solid #3A3524;display:flex;justify-content:space-around;align-items:center;color:var(--muted);font-size:8px}
.steps{max-height:430px;overflow:auto;font-size:12px;position:relative}
.st{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--grid)}.st .t{font:11px var(--mono);color:var(--muted);width:78px;flex:none}
.st.minor{color:var(--muted)}.st.act{color:var(--gold2)}.st.now{background:var(--panel2)}
.mini{position:relative;width:100%;aspect-ratio:9/19;border:2px solid var(--line);border-radius:14px;background:#071A12;overflow:hidden}
.mini i{position:absolute;width:10px;height:10px;margin:-5px;border-radius:5px;background:var(--gold);opacity:.35}
.note{color:var(--muted);font-size:12px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--ink2);margin-top:4px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(3,10,7,.78);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 20px}
.modal[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;width:min(900px,100%)}
.mbox .steps{max-height:520px}
@media (max-width:700px){.mbox .grid>div{grid-column:span 12!important}}
.screen img{width:100%;height:100%;object-fit:cover;display:block}
.scrub{width:100%;margin-top:8px;accent-color:var(--gold)}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;margin-top:8px}
.vid{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 10px}
.vid .pl{flex:none;width:26px;height:26px;border-radius:13px;background:var(--gold);color:var(--bg);display:grid;place-items:center;font-size:11px}
.path{white-space:normal;max-width:300px}
.list td{white-space:normal}
.list{max-height:520px;overflow:auto}
.sv{display:flex;gap:6px;align-items:flex-start;padding:0}
.svb{flex:1;border:0;background:none;text-align:left;padding:10px;min-width:0}
.svb b{display:block;font-size:13px}.svb span{font-size:11px;color:var(--muted)}
.x{border:0;background:none;color:var(--muted);font-size:18px;padding:6px 10px}
.msg ul,.msg ol{margin:4px 0;padding-left:20px}.msg code{font:12px var(--mono);background:var(--panel2);padding:1px 4px;border-radius:4px}
.msg .tbl{margin:6px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head><body>

<div class="top">
  <div class="toprow">
    <div class="brand"><span class="k">LEGACY DYNASTY · ONLY YOUR ACCOUNT</span><span class="t">Owner activity</span></div>
    <span class="badge" id="status">LOADING</span>
  </div>
  <div class="filters">
    <div class="seg" id="f-range"><button data-v="7">7D</button><button data-v="14">14D</button><button data-v="30" class="on">30D</button><button data-v="90">90D</button></div>
    <div class="seg" id="f-by"><button data-v="day" class="on">Day</button><button data-v="week">Week</button><button data-v="weekday">Weekday</button></div>
    <div class="seg" id="f-src"><button data-v="all" class="on">App + web</button><button data-v="0">App</button><button data-v="1">Website</button></div>
    <select id="f-owner" aria-label="Owner"><option value="">All owners</option></select>
  </div>
</div>
<div class="shell">
  <nav class="rail" id="rail"></nav>
  <main id="main"></main>
</div>
<button class="fab" id="fab">Ask AI</button>
<div class="modal" id="modal" hidden></div>

<script>
(async function(){
const H = new URLSearchParams(location.hash.slice(1));
const CFG = window.LEGACY || {};
let TOKEN = CFG.token || H.get('t') || '';
if (H.get('t')) { try { history.replaceState(null,'',location.pathname); } catch(_){} }
const BASE = CFG.api || location.origin;
const tz = CFG.tz || H.get('tz') || Intl.DateTimeFormat().resolvedOptions().timeZone || 'America/Denver';
window.legacySetToken = t => { TOKEN = t; if (window.LEGACY) window.LEGACY.token = t; };  // the app hands over a fresh sign-in
async function api(path, opts={}){
  const tok=(window.LEGACY&&window.LEGACY.token)||TOKEN; if(!tok) throw new Error('Sign in to see owner activity.');
  const r=await fetch(BASE+path,{...opts,headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json',...(opts.headers||{})}});
  if(r.status===401) throw new Error('Your sign-in expired. Close Owner activity and open it again.');
  if(r.status===403) throw new Error("Owner activity is private to the league owner's account.");
  const body=await r.json().catch(()=>({})); if(!r.ok) throw new Error(body.detail||'Something went wrong. Try again.'); return body;
}
function fail(msg){ document.getElementById('main').innerHTML=`<section class="p"><b>${esc(msg)}</b></section>`; document.getElementById('status').textContent='NOT LOADED'; }
const C = ['#3987e5','#d95926','#199e70','#c98500','#d55181','#9085e9'];
const INK='#F2EBDD', INK2='#B9C4BC', MUTED='#7F948A', GRID='#183226', LINE='#1E3A2D', GOLD='#C89B4A', PANEL='#0D1F17';
const SEQ = ['#173126','#3d4a2b','#6b6430','#9b7f37','#C89B4A','#e9c98a'];
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const fmtD = new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'});
const fmtH = new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'numeric',hour12:false,weekday:'short'});
const isoWeek = ds => { const d=new Date(ds+'T12:00:00Z'); const day=(d.getUTCDay()+6)%7; d.setUTCDate(d.getUTCDate()-day+3); const y=d.getUTCFullYear(); const w1=new Date(Date.UTC(y,0,4)); return `${y}-W${String(1+Math.round(((d-w1)/864e5-3+((w1.getUTCDay()+6)%7))/7)).padStart(2,'0')}`; };
let EV, SUM, K, L, ev, NOW, SWEB, SIDX, LOADED=0;
async function load(days){
  document.getElementById('status').textContent='LOADING';
  EV = await api(`/commissioner/activity/feed?days=${days}&tz=${encodeURIComponent(tz)}`); LOADED=days;
  K = Object.fromEntries(EV.kinds.map((k,i)=>[k,i])); L = EV.labels; NOW = EV.now;
  ev = EV.events.map(e=>{ const d=new Date(e[1]*1000); const parts=fmtH.formatToParts(d); const wd=parts.find(p=>p.type==='weekday').value; let h=+parts.find(p=>p.type==='hour').value; if(h===24)h=0;
    const date=fmtD.format(d); return {o:e[0],t:e[1],k:e[2],l:e[3],s:e[4],web:e[5],sess:e[6],b:e[7],date,wd:DAYS.indexOf(wd),h,week:isoWeek(date),month:date.slice(0,7)}; });
  SWEB=[]; ev.forEach(e=>{ SWEB[e.sess]=e.web; });
  SIDX=Object.fromEntries(EV.sessions.map((s,i)=>[s[5],i]));
  const latest=new Map(); ev.forEach(e=>{ if(e.b && !e.web) latest.set(e.o,e.b); });
  const bc=new Map(); latest.forEach(b=>bc.set(b,(bc.get(b)||0)+1));
  SUM={unused:EV.unused, taps:EV.taps, gm_topics:EV.gm_topics, builds:[...bc].sort((x,y)=>String(y[0]).localeCompare(String(x[0]))).map(([build,owners])=>({build,owners}))};
  ownerSelect();
  document.getElementById('status').textContent='LIVE · '+new Date().toLocaleTimeString([], {timeZone:tz,hour:'numeric',minute:'2-digit'});
}
const S = {range:30, by:'day', src:'all', owner:'', sec:'Overview', reports:[], chat:[], session:null, frame:0, playing:false};
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => n>=1000? (n/1000).toFixed(n>=10000?0:1)+'k' : String(Math.round(n*10)/10);

function filtered(offsetDays=0){
  const hi = NOW - offsetDays*86400, lo = hi - S.range*86400;
  return ev.filter(e=>e.t>lo && e.t<=hi && (S.src==='all'||String(e.web)===S.src) && (S.owner===''||String(e.o)===S.owner));
}
function periods(){ // ordered period keys for the range
  const out=[]; for(let i=S.range-1;i>=0;i--){ const ds=fmtD.format(new Date((NOW-i*86400)*1000)); const k=S.by==='week'?isoWeek(ds):S.by==='weekday'?null:ds; if(k && !out.includes(k)) out.push(k); }
  return S.by==='weekday'? DAYS.slice() : out;
}
const keyOf = e => S.by==='week'?e.week:S.by==='weekday'?DAYS[e.wd]:e.date;
const short = k => S.by==='day'? k.slice(5) : k;

// ---------- chart helpers (one axis, thin marks, recessive grid, tooltips on) ----------
const charts=[];
function chart(id, opt){ const el=document.getElementById(id); if(!el) return; const c=echarts.init(el,null,{renderer:'svg'}); c.setOption(Object.assign({
  animation:false, textStyle:{fontFamily:'Inter',color:INK2}, grid:{left:40,right:14,top:22,bottom:28,containLabel:false},
  tooltip:{trigger:'axis',backgroundColor:'#0A1A13',borderColor:LINE,textStyle:{color:INK,fontSize:12},axisPointer:{type:'line',lineStyle:{color:MUTED}}},
},opt)); charts.push(c); return c; }
const xCat = (data,extra={}) => Object.assign({type:'category',data,axisLine:{lineStyle:{color:LINE}},axisTick:{show:false},axisLabel:{color:MUTED,fontSize:10,hideOverlap:true}},extra);
const yVal = (extra={}) => Object.assign({type:'value',splitLine:{lineStyle:{color:GRID}},axisLabel:{color:MUTED,fontSize:10},minInterval:1},extra);
const lineS = (name,data,i=0,area=false) => ({name,type:'line',data,smooth:false,symbol:'circle',symbolSize:5,showSymbol:false,lineStyle:{width:2,color:C[i]},itemStyle:{color:C[i]},areaStyle:area?{color:C[i],opacity:.12}:undefined});
const barS = (name,data,i=0,stack) => ({name,type:'bar',data,stack,barMaxWidth:22,itemStyle:{color:C[i],borderRadius:stack?0:[4,4,0,0],borderColor:PANEL,borderWidth:stack?1:0}});
window.addEventListener('resize',()=>charts.forEach(c=>c.resize()));

// ---------- metrics ----------
const METRICS = {
  'Active owners': es => new Set(es.map(e=>e.o)).size,
  'Sessions': es => new Set(es.map(e=>e.sess)).size,
  'Page views': es => es.filter(e=>e.k===K.screen).length,
  'Actions': es => es.filter(e=>e.k===K.action).length,
  'Taps': es => es.filter(e=>e.k===K.tap).length,
  'Minutes': es => Math.round(es.filter(e=>e.k===K.screen).reduce((a,e)=>a+e.s,0)/60),
  'Alert opens': es => es.filter(e=>e.k===K.push_open).length,
};
const GROUPS = {
  'Day': e=>e.date, 'Week': e=>e.week, 'Month': e=>e.month, 'Weekday': e=>DAYS[e.wd], 'Hour': e=>String(e.h).padStart(2,'0')+':00',
  'Page': e=>e.k===K.screen?L[e.l]:null, 'Action': e=>e.k===K.action?L[e.l]:null, 'Owner': e=>EV.owners[e.o],
  'Platform': e=>e.web?'Website':'App', 'Build': e=>e.b||'(web)',
};
function groupBy(es, gname){ const g=GROUPS[gname], m=new Map(); for(const e of es){ const k=g(e); if(k==null) continue; if(!m.has(k)) m.set(k,[]); m.get(k).push(e);} return m; }
function orderKeys(gname, keys){
  if (gname==='Weekday') return DAYS.filter(d=>keys.includes(d));
  if (['Day','Week','Month','Hour','Build'].includes(gname)) return keys.sort();
  return keys;
}

// ---------- sections ----------
const SECTIONS = ['Overview','Traffic','Pages','Flows','Funnels','Retention','Owners','Sessions','Reports','Ask AI'];
function rail(){ document.getElementById('rail').innerHTML = SECTIONS.map(s=>`<button class="${S.sec===s?'on':''}" data-sec="${s}">${s}${s==='Reports'?`<small>${S.reports.length}</small>`:''}</button>`).join(''); }
function askBtn(q){ return `<button class="ask" data-askq="${esc(q)}">Ask AI ↗</button>`; }
function panel(cls,title,sub,body,q){ return `<section class="p ${cls}"><div class="ph"><b>${esc(title)}${sub?`<span class="sub">${esc(sub)}</span>`:''}</b>${q?askBtn(q):''}</div>${body}</section>`; }

function overview(){
  const cur=filtered(), prev=filtered(S.range), ks=periods();
  const kp = ['Active owners','Sessions','Page views','Actions','Minutes','Taps'].map((m,i)=>{
    const a=METRICS[m](cur), b=METRICS[m](prev), d=b? Math.round(100*(a-b)/b):null;
    return `<div class="kpi"><div class="l">${m}</div><div class="v">${fmt(a)}</div><div class="d ${d==null?'flat':d>0?'up':d<0?'down':'flat'}">${d==null?'no earlier data to compare':`${d>0?'▲':d<0?'▼':'■'} ${Math.abs(d)}% vs prior ${S.range}d`}</div><div class="sp" id="sp${i}"></div></div>`; }).join('');
  const html = `<h2>Overview</h2><p class="lede">Last ${S.range} days${S.owner?` · ${esc(EV.owners[+S.owner])}`:''}. Every chart follows the filters above.</p>
   <div class="kpis">${kp}</div>
   <div class="grid">
    ${panel('c8','Active owners and sessions',`by ${S.by}`,'<div class="chart" id="ch-dau"></div><div class="legend"><span><i style="background:'+C[0]+'"></i>Active owners</span><span><i style="background:'+C[1]+'"></i>Sessions</span></div>','How has daily activity changed this month?')}
    ${panel('c4','Platform','share of page views','<div class="chart" id="ch-plat"></div>')}
    ${panel('c6','Top pages','page views','<div class="chart" id="ch-top"></div>','Which pages should we improve first?')}

function sessRow(s){ const p=s.path.slice(0,5).map(i=>L[i]).join(' → ');
  return `<div><b>${esc(EV.owners[s.o])}</b> <span class="note">${s.web?'website':'app'}</span><div class="note">${esc(when(s.start))} · ${fmtMin(s.secs)}${s.pics?` · ${s.pics} pictures`:''}</div><div class="note path">${esc(p)}</div></div>`; }
const when = t => new Date(t*1000).toLocaleString([], {timeZone:tz,weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
const fmtMin = s => s<60? `${s}s` : `${Math.round(s/6)/10} min`;
async function loadSession(key){
  if(DET[key]) return DET[key];
  DET[key]={loading:true};
  try { DET[key]=await api(`/commissioner/activity/session?key=${encodeURIComponent(key)}&days=${LOADED}&tz=${encodeURIComponent(tz)}`); }
  catch(e){ DET[key]={error:e.message}; }
  return DET[key];
}
function framesOf(d){
  if(d.frames&&d.frames.length) return d.frames.map(f=>({at:Date.parse(f.at),url:f.url}));
  return (d.steps||[]).filter(x=>x.kind==='screen').map(x=>({at:Date.parse(x.t),name:x.name}));
}
function playerHTML(d){
  if(!d||d.loading) return '<p class="note">Loading the session…</p>';
  if(d.error) return `<p class="note">${esc(d.error)}</p>`;
  const fr=framesOf(d); if(!fr.length) return '<p class="note">Nothing to replay in this session.</p>';
  const k=Math.min(S.frame,fr.length-1), f=fr[k], at=f.at;
  const scr=(d.steps||[]).filter(x=>x.kind==='screen'&&Date.parse(x.t)<=at).pop()?.name||f.name||'Home';
  const taps=(d.steps||[]).filter(x=>x.kind==='tap'&&x.detail&&Date.parse(x.t)<=at&&Date.parse(x.t)>at-2000);
  const real=!!f.url;
  return `<div class="screen">${real?`<img src="${esc(f.url)}" alt="${esc(d.owner)}'s screen: ${esc(scr)}">`:mockScreen(f.name||scr)}${taps.map(t=>`<div class="ring" style="left:${t.detail.x*100}%;top:${t.detail.y*100}%"></div>`).join('')}</div>
    <div class="row" style="justify-content:center;margin-top:10px"><button class="btn ghost" data-fr="-1" aria-label="Previous">‹</button><button class="btn" data-play="1">${S.playing?'Pause':'Play'}</button><button class="btn ghost" data-fr="1" aria-label="Next">›</button></div>
    <input type="range" class="scrub" min="0" max="${fr.length-1}" value="${k}" aria-label="Scrub through the session">
    <div class="note" style="text-align:center;margin-top:4px">${real?'Picture':'Page'} ${k+1} of ${fr.length} · ${new Date(at).toLocaleTimeString([], {timeZone:tz,hour:'numeric',minute:'2-digit',second:'2-digit'})}${real?'':' · no pictures (website or an older build)'}</div>`;
}
function stepsHTML(d){
  if(!d||d.loading||d.error) return '';
  const fr=framesOf(d), at=fr.length?fr[Math.min(S.frame,fr.length-1)].at:0;
  return d.steps.map(x=>{const now=Math.abs(Date.parse(x.t)-at)<1500; return `<div class="st${x.kind==='tap'||x.kind==='swipe'?' minor':x.kind==='action'?' act':''}${now?' now':''}"><span class="t">${esc(x.at)}</span><span>${esc(x.name)}${x.secs?` <span class="note">${x.secs}s</span>`:''}</span></div>`;}).join('');
}
function paintPlayer(){ // only the player and step list change while a session plays
  const root=S.modal?document.getElementById('modal'):document.getElementById('main'); if(!root) return;
  const d=DET[S.playKey]; const p=root.querySelector('.player'), st=root.querySelector('.steps');
  if(p) p.innerHTML=playerHTML(d); if(st){ st.innerHTML=stepsHTML(d); const n=st.querySelector('.now'); if(n) st.scrollTop=Math.max(0,n.offsetTop-80); }
}
function play(key){ S.playKey=key; S.frame=0; S.playing=false; clearTimeout(timer); loadSession(key).then(paintPlayer); }
function sessions(){
  const list=sessList();
  if(!S.playKey||!list.some(s=>s.key===S.playKey)){ if(list[0]) play(list[0].key); }
  const cur=list.find(s=>s.key===S.playKey);
  const html=`<h2>Sessions</h2><p class="lede">Every session, step by step, as a video. App sessions play the real pictures from the owner's phone; red rings are taps.</p><div class="grid">
   ${panel('c4','Sessions',`${list.length} in range · newest first`,list.length?`<div class="tbl list"><table><tbody>${list.slice(0,300).map(x=>`<tr class="click" data-sess="${esc(x.key)}" style="${x.key===S.playKey?'background:var(--panel2)':''}"><td>${sessRow(x)}</td><td class="n">▶</td></tr>`).join('')}</tbody></table></div>`:'<p class="note">No sessions in this range.</p>')}
   ${panel('c4','Replay',cur?`${esc(EV.owners[cur.o])} · ${esc(when(cur.start))}`:'','<div class="player"></div>')}
   ${panel('c4','Step by step','','<div class="steps"></div>')}
  </div>`;
  return [html,paintPlayer];
}
function openReplay(key){ S.modal=key; play(key); const m=document.getElementById('modal'); const s=EV.sessions.find(x=>x[5]===key);
  m.innerHTML=`<div class="mbox" role="dialog" aria-modal="true" aria-label="Session replay"><div class="ph"><b>${s?esc(EV.owners[s[0]])+' · '+esc(when(s[1])):'Session'}<span class="sub">${s?fmtMin(s[2]):''}</span></b><button class="btn ghost" data-close="1">Close</button></div>
    <div class="grid"><div class="c6 player" style="grid-column:span 6"></div><div class="c6 steps" style="grid-column:span 6"></div></div></div>`;
  m.hidden=false; paintPlayer(); }
function closeReplay(){ S.modal=null; S.playing=false; clearTimeout(timer); const m=document.getElementById('modal'); m.hidden=true; m.innerHTML=''; }
function videoList(keys, title){
  if(!keys.length) return '<p class="note">No sessions match.</p>';
  return `${title?`<b style="display:block;font-size:12px;margin-top:12px">${esc(title)}</b>`:''}<div class="vids">${keys.map(k=>{const i=SIDX[k]; if(i==null) return ''; const s=EV.sessions[i];
    return `<button class="vid" data-replay="${esc(k)}"><span class="pl">▶</span>${sessRow({o:s[0],start:s[1],secs:s[2],path:s[3],pics:s[4],web:SWEB[i]})}</button>`;}).join('')}</div>`;
}

// ---------- report builder ----------
function reportEvents(r){
  const range=+r.days||S.range, lo=NOW-range*86400;
  let es=ev.filter(e=>e.t>lo&&(S.src==='all'||String(e.web)===S.src)&&(S.owner===''||String(e.o)===S.owner));
  if(r.owner) es=es.filter(e=>EV.owners[e.o].toLowerCase().includes(String(r.owner).toLowerCase()));
  if(r.page) es=es.filter(e=>L[e.l]===r.page); if(r.kind) es=es.filter(e=>e.k===K[r.kind]);
  return es;
}
function runReport(r){
  const es=reportEvents(r), M=METRICS[r.metric]||METRICS['Page views'], grp=GROUPS[r.group]?r.group:'Day';
  const g=groupBy(es,grp); let keys=orderKeys(grp,[...g.keys()]);
  if(['Page','Action','Owner','Platform'].includes(grp)) keys.sort((a,b)=>M(g.get(b))-M(g.get(a)));
  keys=keys.slice(0,grp==='Day'?60:20);
  const sess=[...new Set(es.map(e=>e.sess))].sort((a,b)=>b-a).map(i=>EV.sessions[i][5]);
  if(r.split && r.split!=='None' && GROUPS[r.split]){ const sg=groupBy(es,r.split); const top=[...sg].sort((a,b)=>M(b[1])-M(a[1])).slice(0,5).map(x=>x[0]);
    return {keys, sess, series:top.map(sv=>({name:sv,data:keys.map(k=>M((g.get(k)||[]).filter(e=>GROUPS[r.split](e)===sv)))}))}; }
  return {keys, sess, series:[{name:r.metric,data:keys.map(k=>M(g.get(k)||[]))}]};
}
function drawReport(id,r){
  const {keys,series,sess}=runReport(r); const el=document.getElementById(id); if(!el) return;
  const vid=document.getElementById(id+'-v'); if(vid) vid.innerHTML=r.videos?`<div class="ph" style="margin-top:12px"><b>Sessions in this report<span class="sub">${sess.length} sessions · newest first · tap one to watch it</span></b></div>${videoList(sess.slice(0,12))}`:'';
  if(!keys.length){ el.innerHTML='<p class="note">Nothing matches in this range.</p>'; el.style.height='auto'; return; }
  if(r.chart==='Table'){ el.innerHTML=`<div class="tbl"><table><thead><tr><th>${esc(r.group)}</th>${series.map(s=>`<th class="n">${esc(s.name)}</th>`).join('')}</tr></thead><tbody>${keys.map((k,i)=>`<tr><td>${esc(k)}</td>${series.map(s=>`<td class="n">${s.data[i]}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`; el.style.height='auto'; return; }
  const horiz=r.chart==='Bars'&&['Page','Action','Owner'].includes(r.group);
  const ser=series.map((s,i)=>r.chart==='Line'?lineS(s.name,s.data,i,series.length===1):barS(s.name,s.data,i,series.length>1?'x':undefined));
  if(horiz){ ser.forEach(s=>{ s.itemStyle.borderRadius=series.length>1?0:[0,4,4,0]; s.data=s.data.slice().reverse(); }); }
  chart(id,{legend:series.length>1?{top:0,textStyle:{color:INK2,fontSize:11},icon:'roundRect',itemWidth:10,itemHeight:10}:undefined,
    grid:horiz?{left:140,right:20,top:series.length>1?34:8,bottom:20}:{left:40,right:14,top:series.length>1?34:14,bottom:28},
    xAxis:horiz?yVal():xCat(keys.map(k=>r.group==='Day'?k.slice(5):k)),yAxis:horiz?xCat(keys.slice().reverse(),{axisLabel:{color:INK2,fontSize:11}}):yVal(),series:ser});
}
const PRESETS=[
  {name:'Lineup sets by weekday',metric:'Actions',group:'Weekday',split:'None',kind:'action',page:'Set a lineup',chart:'Bars',videos:true},
  {name:'Page views by owner',metric:'Page views',group:'Owner',split:'None',kind:'',page:'',chart:'Bars'},
  {name:'Sessions by day, app vs web',metric:'Sessions',group:'Day',split:'Platform',kind:'',page:'',chart:'Bars'},
  {name:'Trade builder visits',metric:'Page views',group:'Owner',split:'None',kind:'screen',page:'Trade builder',chart:'Bars',videos:true},
  {name:'Minutes by hour',metric:'Minutes',group:'Hour',split:'None',kind:'',page:'',chart:'Line'},
];
const describe = r => `${r.metric} by ${r.group}${r.split&&r.split!=='None'?', split by '+r.split:''}${r.page?' · '+r.page:''}${r.owner?' · '+r.owner:''}${r.videos?' · with videos':''}`;
function reports(){
  S.draft = S.draft || Object.assign({}, PRESETS[0]);
  const d=S.draft, opt=(name,vals)=>{const key=name.toLowerCase(); return `<label class="field">${name}<select data-rf="${key}">${vals.map(v=>`<option ${String(d[key]??'')===v||(v==='Any'&&!d[key])?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`;};
  const pages=['Any',...new Set(ev.filter(e=>e.k===K.screen||e.k===K.action).map(e=>L[e.l]))].sort((a,b)=>a==='Any'?-1:b==='Any'?1:a.localeCompare(b));
  const html=`<h2>Reports</h2><p class="lede">Build any breakdown: what to count, how to group it, an optional split, filters and a chart. Turn on videos to list every matching session as a replay. Saved reports are kept on your account.</p><div class="grid">
   ${panel('c4','Report builder','',`<div style="display:grid;gap:10px">
      <label class="field">Name<input type="text" id="rname" value="${esc(d.name||'')}" placeholder="My report"></label>
      ${opt('Metric',Object.keys(METRICS))}${opt('Group',Object.keys(GROUPS))}${opt('Split',['None','Platform','Owner','Page','Action','Build','Weekday'])}
      ${opt('Page',pages)}${opt('Kind',['Any','screen','action','tap','swipe','push_open','app_open','error'])}${opt('Chart',['Bars','Line','Table'])}
      <label class="note"><input type="checkbox" data-rv="1" ${d.videos?'checked':''}> Show the sessions as videos</label>
      <div class="row"><button class="btn" id="rsave">Save report</button><button class="btn ghost" data-askq="Explain this report and what stands out: ${esc(describe(d))}">Ask AI about it</button></div>
      <div class="note" id="rmsg">${esc(S.rmsg||'')}</div></div>`)}
   ${panel('c8',d.name||'Untitled report',`${esc(describe(d))} · last ${+d.days||S.range} days`,'<div class="chart tall" id="ch-report"></div><div id="ch-report-v"></div>')}
   ${panel('','Saved reports',`${S.reports.length} saved · starter reports after them`,`<div class="saved">${[...S.reports.map(r=>({r,mine:true})),...PRESETS.map(r=>({r}))].map(({r,mine})=>`<div class="sv"><button class="svb" data-load='${esc(JSON.stringify(r))}'><b>${esc(r.name)}</b><span>${esc(describe(r))} · ${esc(r.chart)}${mine?'':' · starter'}</span></button>${mine&&r.id?`<button class="x" data-delrep="${esc(r.id)}" aria-label="Delete ${esc(r.name)}">×</button>`:''}</div>`).join('')}</div>`)}
  </div>`;
  return [html,()=>drawReport('ch-report',d)];
}
async function saveReport(r){
  try { const out=await api('/commissioner/activity/reports',{method:'POST',body:JSON.stringify({spec:r})}); S.reports=S.reports.filter(x=>x.name!==out.name).concat(out); S.draft=out; S.rmsg='Saved.'; }
  catch(e){ S.rmsg=e.message; }
  if(S.sec==='Reports') render();
}

// ---------- Ask AI ----------
// The analyst on the server reads every event and session (api/usage_ai.py). It can answer with a report
// (drawn here, savable) and with sessions (playable here).
const STARTERS=['How has daily activity changed this month?','Which pages should we improve first?','What do owners do on Thursdays vs Mondays?',
  "Who hasn't set a lineup this week?",'Where do owners drop off on the way to a trade?','Build a report of GM questions by owner with videos','Show me the longest sessions this week'];
function md(text){ // small markdown: paragraphs, bullets, numbered lists, tables, bold, code
  const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  const lines=String(text||'').split('\n'); let out='', list=null, table=[];
  const flushList=()=>{ if(list){ out+=`</${list}>`; list=null; } };
  const flushTable=()=>{ if(!table.length) return; const rows=table.filter(r=>!/^\|?\s*:?-{2,}/.test(r)).map(r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));
    out+=`<div class="tbl"><table><thead><tr>${rows[0].map(c=>`<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${rows.slice(1).map(r=>`<tr>${r.map(c=>`<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`; table=[]; };
  for(const raw of lines){ const l=raw.trim();
    if(l.startsWith('|')){ flushList(); table.push(l); continue; } flushTable();
    let m;
    if((m=l.match(/^[-*•]\s+(.*)/))){ if(list!=='ul'){ flushList(); out+='<ul>'; list='ul'; } out+=`<li>${inline(m[1])}</li>`; continue; }
    if((m=l.match(/^\d+[.)]\s+(.*)/))){ if(list!=='ol'){ flushList(); out+='<ol>'; list='ol'; } out+=`<li>${inline(m[1])}</li>`; continue; }
    flushList();
    if((m=l.match(/^#{1,4}\s+(.*)/))){ out+=`<p><b>${inline(m[1])}</b></p>`; continue; }
    if(l) out+=`<p>${inline(l)}</p>`;
  }
  flushList(); flushTable(); return out;
}
async function askAI(q){
  const deep=!!document.getElementById('deep')?.checked;
  const history=S.chat.filter(m=>m.text).slice(-3).flatMap(m=>[{role:'user',content:m.q},{role:'assistant',content:m.text}]);
  const m={q,pending:true}; S.chat.push(m); S.sec='Ask AI'; render();
  try { const out=await api('/commissioner/activity/ask',{method:'POST',body:JSON.stringify({question:q,days:S.range,tz,deep,history})});
    Object.assign(m,{text:out.answer,a:md(out.answer),r:out.report||null,sess:(out.sessions||[]).map(s=>s.key),stitle:out.sessions_title||'',meta:`${out.model} · $${(+out.cost||0).toFixed(3)}`}); }
  catch(e){ Object.assign(m,{a:`<p>${esc(e.message)}</p>`}); }
  m.pending=false; if(S.sec==='Ask AI') render();
}
function aiSec(){
  const html=`<h2>Ask AI</h2><p class="lede">Ask anything about how owners use the app and the website. The analyst reads every page, tap, action and session, then answers. Ask it to build a report (you can save it) or to show you sessions (you can watch them).</p>
   <div class="grid">${panel('','','',`<div class="chat">${S.chat.map((m,i)=>`<div class="msg q">${esc(m.q)}</div><div class="msg a">${m.pending?'<p class="note">Looking through the activity…</p>':m.a}
       ${m.r?`<div class="ph" style="margin-top:10px"><b>${esc(m.r.name)}<span class="sub">${esc(describe(m.r))}</span></b><button class="btn ghost" data-saveai="${i}">Save as report</button></div><div class="chart" id="ai${i}" style="height:240px"></div><div id="ai${i}-v"></div>`:''}
       ${m.sess&&m.sess.length?videoList(m.sess,m.stitle||'Sessions to watch'):''}
       ${m.meta?`<div class="meta">${esc(m.meta)}</div>`:''}</div>`).join('')}
     <div class="chips">${STARTERS.map(q=>`<button class="chip" data-askq="${esc(q)}">${esc(q)}</button>`).join('')}</div>
     <div class="row"><textarea id="aiq" rows="2" style="flex:1;min-width:0" placeholder="e.g. Which owners only use the website?"></textarea><button class="btn" id="aisend">Ask</button></div>
     <label class="note"><input type="checkbox" id="deep" ${S.deep?'checked':''}> Dig deeper (a stronger model, a few cents)</label></div>`)}</div>`;
  return [html,()=>{ S.chat.forEach((m,i)=>{ if(m.r) drawReport('ai'+i,m.r); }); document.getElementById('main').querySelector('.msg:last-of-type')?.scrollIntoView({block:'nearest'}); }];
}
const RENDER={Overview:overview,Traffic:traffic,Pages:pagesSec,Flows:flows,Funnels:funnels,Retention:retention,Owners:owners,Sessions:sessions,Reports:reports,'Ask AI':aiSec};
function render(){ charts.splice(0).forEach(c=>c.dispose()); rail(); const [html,after]=RENDER[S.sec](); document.getElementById('main').innerHTML=html; after(); }
function ownerSelect(){ const sel=document.getElementById('f-owner'); sel.innerHTML='<option value="">All owners</option>'+EV.owners.map((n,i)=>`<option value="${i}">${esc(n)}</option>`).join(''); sel.value=S.owner; }
document.getElementById('f-owner').addEventListener('change',e=>{S.owner=e.target.value; render();});
for (const [id,key] of [['f-range','range'],['f-by','by'],['f-src','src']]) document.getElementById(id).addEventListener('click',async e=>{ const b=e.target.closest('button'); if(!b) return;
  document.querySelectorAll(`#${id} button`).forEach(x=>x.classList.toggle('on',x===b)); S[key]= key==='range'? +b.dataset.v : b.dataset.v;
  if(key==='range' && S.range*2>LOADED){ await load(Math.min(365,S.range*2)); } render(); });
let timer=null;
function tick(){ const d=DET[S.playKey]; if(!S.playing||!d||d.loading) return; const fr=framesOf(d); if(S.frame>=fr.length-1){S.playing=false; paintPlayer(); return;}
  const gap=fr[S.frame+1].at-fr[S.frame].at; timer=setTimeout(()=>{S.frame++; paintPlayer(); tick();},Math.max(450,Math.min(gap,1600))); }
document.addEventListener('input',e=>{ if(e.target.classList.contains('scrub')){ S.frame=+e.target.value; S.playing=false; clearTimeout(timer); paintPlayer(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&S.modal) closeReplay(); });
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-sec],[data-askq],[data-sort],[data-owner],[data-sess],[data-fr],[data-play],[data-funnel],[data-load],[data-saveai],[data-replay],[data-close],[data-delrep],#rsave,#aisend,#fab,#modal'); if(!t) return;
  const d=t.dataset;
  if(t.id==='modal'){ if(e.target===t) closeReplay(); return; }
  if(d.close){ closeReplay(); return; }
  if(d.replay){ openReplay(d.replay); return; }
  if(d.fr||d.play){ const det=DET[S.playKey]; if(!det||det.loading) return; const n=framesOf(det).length;
    if(d.fr){ S.frame=Math.max(0,Math.min(n-1,S.frame+(+d.fr))); S.playing=false; clearTimeout(timer); }
    if(d.play){ S.playing=!S.playing; clearTimeout(timer); if(S.playing){ if(S.frame>=n-1) S.frame=0; tick(); } }
    paintPlayer(); return; }
  if(d.sess){ play(d.sess); document.querySelectorAll('[data-sess]').forEach(r=>r.style.background=r.dataset.sess===d.sess?'var(--panel2)':''); return; }
  if(t.id==='fab'){ S.sec='Ask AI'; }
  if(d.sec){ S.sec=d.sec; S.playing=false; clearTimeout(timer); }
  if(d.askq){ askAI(d.askq); return; }
  if(d.sort){ S.sort=d.sort; }
  if(d.owner!=null){ S.owner=d.owner; document.getElementById('f-owner').value=d.owner; S.sec='Overview'; }
  if(d.funnel){ S.funnel=d.funnel; }
  if(d.load){ S.draft=JSON.parse(d.load); S.rmsg=''; }
  if(d.delrep){ const id=d.delrep; api(`/commissioner/activity/reports/${encodeURIComponent(id)}`,{method:'DELETE'}).then(()=>{ S.reports=S.reports.filter(r=>r.id!==id); render(); }).catch(err=>{ S.rmsg=err.message; render(); }); return; }
  if(t.id==='rsave'){ saveReport(Object.assign({},S.draft,{name:document.getElementById('rname').value.trim()||S.draft.name||'My report'})); return; }
  if(d.saveai!=null){ const r=S.chat[+d.saveai].r; S.draft=Object.assign({},r); S.sec='Reports'; saveReport(r); return; }
  if(t.id==='aisend'){ const q=document.getElementById('aiq').value.trim(); S.deep=!!document.getElementById('deep')?.checked; if(q){ askAI(q); return; } }
  render();
});
document.addEventListener('change',e=>{
  const f=e.target.dataset.rf; if(f){ const v=e.target.value; S.draft=Object.assign({},S.draft,{[f]:v==='Any'?'':v}); render(); }
  if(e.target.dataset.rv){ S.draft=Object.assign({},S.draft,{videos:e.target.checked}); render(); }
  if(e.target.id==='deep') S.deep=e.target.checked;
  const fs=e.target.dataset.fstep; if(fs!=null){ const cur=(FUNNELS[S.funnel]||S.custom||[]).slice(); cur[+fs]=e.target.value; S.custom=cur; S.funnel=null; render(); }
});
document.addEventListener('keydown',e=>{ if(e.target.id==='aiq'&&e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); document.getElementById('aisend').click(); } });

// ---------- start ----------
try {
  await load(Math.max(60,S.range*2));
  api('/commissioner/activity/reports').then(out=>{ S.reports=out.reports||[]; rail(); if(S.sec==='Reports') render(); }).catch(()=>{});
  render();
} catch(e) { fail(e.message); }
})();
</script>
</body></html>
