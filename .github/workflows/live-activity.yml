name: Live Activity watcher

# Manual BACKUP only. The watcher runs all the time on the free Google VM (deploy/live-watcher/startup.sh,
# service legacy-live-activity); its game-window schedule here was dropped because GitHub started it up to
# 4 hours late. Don't run this while the VM is up, or each update goes to Apple twice.
# Free on this public repo. The watcher idles cheaply when nobody has a Live Activity running.
# Needs repo secrets APNS_KEY_P8 and APNS_KEY_ID (see api/apns.py); without them it exits right away.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: How long to watch (max 350)
        default: "350"

concurrency:
  group: live-activity-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: pip install -r api/requirements.txt "httpx[http2]" "pyjwt[crypto]"

      - name: Watch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
          # The key id is not secret (only the .p8 is); the fallback is the 2026-11-02 "Legacy Live Scores" key.
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID || 'M4JQR79FN5' }}
          MAX_MINUTES: ${{ inputs.minutes || '350' }}
        run: python scripts/live_activity_watcher.py
