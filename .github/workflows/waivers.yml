name: Waivers

# FAAB bids run Wednesday and Sunday at 3:00 AM Eastern. Both UTC times cover daylight and standard time;
# a run with nothing due does nothing. The app also runs due bids the first time anyone opens it after 3 AM.
on:
  schedule:
    - cron: "2 7 * * 0,3"
    - cron: "2 8 * * 0,3"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install supabase
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m scripts.process_waivers
