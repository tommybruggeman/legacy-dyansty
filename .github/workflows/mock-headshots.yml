name: mock headshots (one-off, for design mockups)
on:
  push:
    branches: [claude/headshots-mock]
permissions:
  contents: write
jobs:
  fetch:
    if: "!contains(github.event.head_commit.message, 'mock headshots')"
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out
          curl -s https://api.sleeper.app/v1/players/nfl -o players.json
          python3 - "Justin Jefferson,Drake Maye,Bijan Robinson,Puka Nacua,Tucker Kraft,Bucky Irving,Josh Allen" <<'PY'
          import json, sys, urllib.request
          players = json.load(open("players.json"))
          want = [n.strip().lower() for n in sys.argv[1].split(",") if n.strip()]
          for pid, p in players.items():
              name = f"{p.get('first_name','')} {p.get('last_name','')}".strip().lower()
              if name in want and p.get("active"):
                  urllib.request.urlretrieve(f"https://sleepercdn.com/content/nfl/players/{pid}.jpg", f"out/{name.replace(' ', '_')}.jpg")
                  print(name, pid)
          PY
      - uses: actions/checkout@v4
        with:
          path: repo
      - run: |
          cd repo && mkdir -p mock_heads && cp ../out/*.jpg mock_heads/
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add mock_heads && git commit -m "mock headshots [skip ci]" && git push
