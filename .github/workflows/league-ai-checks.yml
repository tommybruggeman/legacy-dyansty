name: League AI checks

# Run by hand: how accurate the playoff odds are on past seasons, how the 20-answer playoff-odds trial is going,
# start/sit graded on every saved lineup, the free pre-deploy practice test,
# shadow scoring (our own scoring engine vs Sleeper's scores on every finished week), and the live feed
# probe (run during games: how far the free feeds trail real plays and what a game-day watcher costs).
on:
  workflow_dispatch:
    inputs:
      check:
        description: Which check to run
        type: choice
        options: [odds_backtest, odds_trial, odds_grade, start_sit_grade, practice_test, weekly_cards, shadow_scoring, live_probe]
        default: odds_backtest
      minutes:
        description: live_probe only - how long to watch (minutes)
        default: "30"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.check == 'live_probe' && 200 || 20 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install supabase requests pandas
      - if: inputs.check == 'start_sit_grade' || inputs.check == 'practice_test' || inputs.check == 'weekly_cards'
        run: pip install -r api/requirements.txt
      - name: Run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REPORT_DETAIL: ${{ vars.REPORT_DETAIL }}
          LEAGUE_AI_IDEA_LOG: "off"
        run: |
          case "${{ inputs.check }}" in
            odds_trial) python -m league_ai.odds_trial ;;
            odds_grade) python -m league_ai.matchup_odds ;;
            start_sit_grade) python -m league_ai.start_sit_grade ;;
            practice_test) python -m league_ai.practice_test ;;
            # the weekly start/sit scorecard and accepted-trade shares now, without waiting for Tuesday's learning job (no model calls)
            weekly_cards) python -m league_ai.scorecard ;;
            shadow_scoring) python -m scoring.shadow ;;
            live_probe) python -m scoring.live_probe --minutes "${{ inputs.minutes }}" --every 5 --leagues 2 ;;
            *) python -m league_ai.playoff_odds ;;
          esac
