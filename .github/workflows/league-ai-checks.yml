name: League AI checks

# Run by hand: how accurate the playoff odds are on past seasons, how the 20-answer playoff-odds trial is going,
# and the Assistant GM stress test (stress_test asks the questions under a budget; stress_grade scores them once games are final).
on:
  workflow_dispatch:
    inputs:
      check:
        description: Which check to run
        type: choice
        options: [odds_backtest, odds_trial, odds_grade, stress_test, stress_grade, stress_rosters, stress_contracts, stress_league_link]
        default: odds_backtest
      budget:
        description: "stress_test only: stop before spending more than this many dollars"
        default: "5"
      questions:
        description: "stress_test only: how many questions"
        default: "50"

permissions:
  contents: write  # the stress test saves its results (encrypted) to its own branch

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install supabase requests pandas anthropic
      - if: startsWith(inputs.check, 'stress')
        run: pip install -r api/requirements.txt
      - name: Run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REPORT_DETAIL: ${{ vars.REPORT_DETAIL }}
          ANTHROPIC_API_KEY: ${{ inputs.check == 'stress_test' && secrets.ANTHROPIC_API_KEY || '' }}
          STRESS_BUDGET: ${{ inputs.budget }}
          STRESS_QUESTIONS: ${{ inputs.questions }}
          STRESS_MAX_ANSWER: "0.2"
        run: |
          case "${{ inputs.check }}" in
            odds_trial) python -m league_ai.odds_trial ;;
            odds_grade) python -m league_ai.matchup_odds ;;
            stress_test) python -m league_ai.stress_test ask ;;
            stress_rosters) python -m league_ai.stress_test rosters ;;
            stress_league_link) python -m league_ai.stress_test league_link ;;
            stress_contracts) python -m league_ai.stress_test contracts ;;
            stress_grade) python -m league_ai.stress_test grade stress/grading-input.json ;;
            *) python -m league_ai.playoff_odds ;;
          esac
      - name: Commit the stress test results to this branch, encrypted
        # The repo is public and the answers name owners' rosters and plans, so only an encrypted copy is committed.
        # It opens with the private key kept in the project files (stress/results-key.pub.pem is its public half).
        if: always() && (inputs.check == 'stress_test' || inputs.check == 'stress_rosters' || inputs.check == 'stress_contracts') && github.ref_name != 'main'
        run: |
          [ -f stress_results.json ] || exit 0
          KEY=$(openssl rand -hex 32)
          gzip -c stress_results.json | openssl enc -aes-256-cbc -pbkdf2 -salt -pass "pass:$KEY" -out stress/results.json.gz.enc
          printf %s "$KEY" | openssl pkeyutl -encrypt -pubin -inkey stress/results-key.pub.pem -pkeyopt rsa_padding_mode:oaep -out stress/results.key.enc
          git config user.name "github-actions[bot]" && git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add stress/results.json.gz.enc stress/results.key.enc && git commit -qm "Stress test results (encrypted)" && git push origin HEAD:${{ github.ref_name }}
      - name: Save the stress test results
        if: always() && startsWith(inputs.check, 'stress')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.check }}-results
          path: stress_*.json
          if-no-files-found: ignore
          retention-days: 7
