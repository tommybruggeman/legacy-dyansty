name: League AI checks

# Run by hand: how accurate the playoff odds are on past seasons, how the 20-answer playoff-odds trial is going,
# start/sit graded on every saved lineup, the free pre-deploy practice test,
# shadow scoring (our own scoring engine vs Sleeper's scores on every finished week),
# the live projection study (which mid-game projection update predicts final scores best),
# the ESPN feed check (our live stat source scored by our engine vs Sleeper),
# and the future plan check (plan_future for every owner).
on:
  workflow_dispatch:
    inputs:
      check:
        description: Which check to run
        type: choice
        options: [odds_backtest, odds_trial, odds_grade, start_sit_grade, practice_test, weekly_cards, shadow_scoring, live_projection_study, espn_feed_check, final_scores_check, future_plan_check]
        default: odds_backtest

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install supabase requests pandas
      - if: inputs.check == 'start_sit_grade' || inputs.check == 'practice_test' || inputs.check == 'weekly_cards' || inputs.check == 'future_plan_check'
        run: pip install -r api/requirements.txt
      - if: inputs.check == 'live_projection_study'
        run: pip install pyarrow numpy
      - name: Run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REPORT_DETAIL: ${{ vars.REPORT_DETAIL }}
          LEAGUE_AI_IDEA_LOG: "off"
        run: |
          case "${{ inputs.check }}" in
            odds_trial) python -m league_ai.odds_trial ;;
            odds_grade) python -m league_ai.matchup_odds ;;
            start_sit_grade) python -m league_ai.start_sit_grade ;;
            practice_test) python -m league_ai.practice_test ;;
            # the weekly start/sit scorecard and accepted-trade shares now, without waiting for Tuesday's learning job (no model calls)
            weekly_cards) python -m league_ai.scorecard ;;
            shadow_scoring) python -m scoring.shadow ;;
            live_projection_study) python -m scoring.live_projection_study ;;
            # the ESPN stat feed (live watcher's source) scored with our engine vs Sleeper on recent finished weeks
            espn_feed_check) python -m scoring.espn_check --weeks 3 ;;
            # official finals from nflverse scored by our engine vs Sleeper, every finished week (saves nothing)
            final_scores_check) python -m scripts.final_scores --dry ;;
            # plan_future for every owner (counts only in the log); the full answers are printed encrypted for review
            future_plan_check)
              FUTURE_OUT=/tmp/future.json.gz python -m league_ai.future_check || status=$?
              if [ -f /tmp/future.json.gz ]; then
                openssl rand -hex 32 > /tmp/k
                echo "ENCRYPTED_KEY $(openssl pkeyutl -encrypt -pubin -inkey league_ai/checks_public_key.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k | base64 -w0)"
                echo "ENCRYPTED_DATA $(openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:/tmp/k -in /tmp/future.json.gz | base64 -w0)"
                rm -f /tmp/k /tmp/future.json.gz
              fi
              exit ${status:-0} ;;
            *) python -m league_ai.playoff_odds ;;
          esac
