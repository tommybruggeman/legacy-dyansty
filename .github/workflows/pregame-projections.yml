name: Pregame projections

# Freezes each player's projection just before his game kicks off, so the app's "proj" under a live or final score
# is the real pregame number (league_ai.projection_calibration.pregame_snapshots). Every 10 minutes in the hours NFL
# games can start (UTC); it does nothing unless a kickoff is within 75 minutes. Free on this public repo. Counts only.
on:
  schedule:
    - cron: "*/10 0-1,12-23 * * *"
  workflow_dispatch:

concurrency:
  group: pregame-projections
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt
      - name: Freeze projections for games about to start
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m league_ai.projection_calibration --pregame
