name: NFL data sync

on:
  schedule:
    # 09:00 UTC daily = 02:00 Mountain. The full load (every loader, four seasons).
    - cron: "0 9 * * *"
    # Game-night refreshes: just this season's stats and scores, about an hour after each
    # window ends (nflverse posts box scores within a couple of hours), so the Front Office AI
    # and player game logs have a game the same night instead of the next day. Odd minutes
    # because GitHub delays top-of-hour schedules the most. Times are UTC.
    - cron: "13 22 * * 0,6"     # Sunday (and late-season Saturday) early games
    - cron: "13 1 * * 0,1"      # late afternoon games
    - cron: "43 5 * * 0,1,2,5"  # night games (Sat, Sun, Mon, Thu)
    - cron: "13 7 * * 1,2,5"    # night games, second try
    # Practice reports, Sep-Jan only: injury report + day-by-day practice for this week (about 30s each).
    # Teams post after practice (4-6pm ET); ESPN's notes land that evening, nflverse rebuilds the
    # official report overnight or the next morning.
    - cron: "47 22 * 9-12,1 *"  # ~5:45pm ET
    - cron: "17 1 * 9-12,1 *"   # ~8:15pm ET
    - cron: "23 16 * 9-12,1 *"  # ~11:20am ET, after nflverse's morning rebuild
  workflow_dispatch:
    inputs:
      only:
        description: "Loader or comma list (players, stats, games, values, injuries, practice, injury_history, prospects, situational); blank for all"
        required: false
        default: ""
      seasons:
        description: "Space-separated seasons for stats (blank = current + 3 prior)"
        required: false
        default: ""

concurrency:
  group: nfl-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install supabase requests pandas

      - name: Run NFL data sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          ARGS=""
          SCHEDULE="${{ github.event.schedule }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "$SCHEDULE" in
              "0 9 * * *") ;;
              *" 9-12,1 *") ARGS="--practice" ;;
              *) ARGS="--game-night" ;;
            esac
          fi
          if [ -n "${{ github.event.inputs.only }}" ]; then ARGS="$ARGS --only ${{ github.event.inputs.only }}"; fi
          if [ -n "${{ github.event.inputs.seasons }}" ]; then ARGS="$ARGS --seasons ${{ github.event.inputs.seasons }}"; fi
          python -m pipeline.nfl_data.run $ARGS
