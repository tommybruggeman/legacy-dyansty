name: VM watcher logs (diagnostic)
# Temporary: prints the Live Activity watcher's status + count lines from the free VM. Counts only (public logs).
on:
  push:
    branches: [claude/vm-logs]
jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: |
          gcloud compute ssh legacy-live-watcher --project legacy-dynasty-25024 --zone us-central1-a --quiet --strict-host-key-checking=no \
            --command "sudo journalctl -u legacy-watcher --since '-60 min' --no-pager -o short-iso | grep -E 'WATCH_ERROR|pass [0-9]+:' | cut -c1-220 | tail -12"
