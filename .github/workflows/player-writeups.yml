name: Player write-ups

on:
  schedule:
    # Tuesdays 16:45 UTC (~11:45am ET), after nflverse's morning rebuild locks Monday night's stats.
    - cron: "45 16 * 9-12,1 2"
    # Wednesday backup: fills in anyone missed (a rerun never rewrites a saved recap).
    - cron: "45 16 * 9-12,1 3"
  workflow_dispatch:
    inputs:
      week:
        description: "NFL week (blank = newest week with stats)"
        required: false
      dry_run:
        description: "Only count players, call nothing"
        type: boolean
        default: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install supabase anthropic

      - name: Write and save this week's recaps
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.week }}" ]; then ARGS="$ARGS --week ${{ github.event.inputs.week }}"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m league_ai.writeups $ARGS
