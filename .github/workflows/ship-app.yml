# Ships the iOS app's server and/or a TestFlight build from main, with no Mac.
# Run by hand (Actions tab, or the GitHub API) after a merge.
#
# Secrets (one-time setup):
#   GCP_SA_KEY  - JSON key for the github-deploy service account in legacy-dynasty-25024
#   EXPO_TOKEN  - Expo access token for the tbrugge account
name: Ship app

on:
  workflow_dispatch:
    inputs:
      server:
        description: Deploy the API server to Cloud Run
        type: boolean
        default: true
      ios:
        description: Build on Expo and submit to TestFlight (uses ios.buildNumber in mobile/app.json)
        type: boolean
        default: true
      builder:
        description: Where to build iOS. "github" builds on a free GitHub Mac runner (use when Expo's free monthly builds are used up)
        type: choice
        options: [expo, github]
        default: expo
      practice:
        description: Run the free practice test first (start/sit, odds, trade tools on the real league) and stop if it fails
        type: boolean
        default: true

concurrency:
  group: ship-app
  cancel-in-progress: false

jobs:
  # Free: the engine's own numbers on the real league, no model calls (league_ai/practice_test.py). Prints rates only.
  practice:
    if: ${{ inputs.server && inputs.practice }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install supabase requests && pip install -r api/requirements.txt
      - name: Practice test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LEAGUE_AI_IDEA_LOG: "off"
        run: python -m league_ai.practice_test

  server:
    needs: practice
    if: ${{ inputs.server && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT: legacy-dynasty-25024
      REGION: us-central1
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build image
        run: |
          IMG="$REGION-docker.pkg.dev/$PROJECT/legacy/legacy-api:${GITHUB_SHA::7}"
          echo "IMG=$IMG" >> "$GITHUB_ENV"
          cp api/Dockerfile Dockerfile
          gcloud builds submit --project "$PROJECT" --tag "$IMG" --suppress-logs
      - name: Deploy
        # No min-instances: the server must stay on the free tier.
        run: |
          gcloud run deploy legacy-api --project "$PROJECT" --region "$REGION" --image "$IMG" --cpu-boost --quiet
          URL=$(gcloud run services describe legacy-api --project "$PROJECT" --region "$REGION" --format 'value(status.url)')
          curl -fsS "$URL/health"

  ios:
    if: ${{ inputs.ios && inputs.builder != 'github' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Build on Expo and submit to TestFlight
        # --no-wait: Expo builds and submits on its own machines, so this job doesn't sit idle.
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx -y eas-cli@latest build -p ios --profile production --auto-submit --non-interactive --no-wait

  # Same build on a GitHub Mac (free for this public repo), then upload it with EAS Submit.
  # EAS still holds the signing certificate, profile and App Store Connect key.
  ios-github:
    if: ${{ inputs.ios && inputs.builder == 'github' }}
    runs-on: macos-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Use the newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Build on this Mac
        run: npx -y eas-cli@latest build -p ios --profile production --local --non-interactive --output "$RUNNER_TEMP/legacy.ipa"
      - name: Submit to TestFlight
        run: npx -y eas-cli@latest submit -p ios --profile production --path "$RUNNER_TEMP/legacy.ipa" --non-interactive
