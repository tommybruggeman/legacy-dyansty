name: Sleeper sync

on:
  schedule:
    # Every 15 minutes. The sync is idempotent and skips instantly when the
    # league is paused or nothing is new, so polling more often than Sleeper
    # actually processes waivers costs one API call.
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  # Never let two runs apply the same transaction window at once.
  group: sleeper-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install supabase requests

      - name: Run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SYNC_BOT_EMAIL: ${{ secrets.SYNC_BOT_EMAIL }}
          SYNC_BOT_PASSWORD: ${{ secrets.SYNC_BOT_PASSWORD }}
        run: python scripts/run_sleeper_sync.py
