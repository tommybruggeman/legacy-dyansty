name: Sleeper sync

on:
  schedule:
    # Backup only: the free Google VM runs this sync every 15 minutes
    # (deploy/live-watcher/startup.sh). GitHub ran a 15-minute schedule only
    # about every 6 hours. The sync is idempotent by key, so an overlap is harmless.
    - cron: "37 */4 * * *"
  workflow_dispatch:

concurrency:
  # Never let two runs apply the same transaction window at once.
  group: sleeper-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install supabase requests

      - name: Run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SYNC_BOT_EMAIL: ${{ secrets.SYNC_BOT_EMAIL }}
          SYNC_BOT_PASSWORD: ${{ secrets.SYNC_BOT_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/run_sleeper_sync.py

      # Queues a "trade completed" alert for every owner (sent by the Push alerts job). Never fails the sync.
      - name: Trade alerts
        if: always()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/notify_trades.py
